name: Validate plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Test settings sanitization
        run: php tests/settings-smoke.php
      - name: Test updater state validation
        run: php tests/updater-smoke.php
      - name: Test Configuration menu shortcut
        run: php tests/menu-smoke.php
      - name: Test anonymous login assets
        run: php tests/setup-smoke.php
      - name: Test anonymous managed media
        run: php tests/media-smoke.php
      - name: Test settings migration on install
        run: php tests/install-smoke.php
      - name: Check JavaScript syntax
        run: node --check public/js/eso-theme.js
      - name: Check shell scripts
        run: bash -n scripts/install.sh scripts/update.sh
